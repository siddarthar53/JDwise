name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.app.json
      - run: npm run build

  api:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: server } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: server/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  agent:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: agent } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: agent/requirements.txt }
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q tests
      # Regression gate: a PR that lowers quality/groundedness or leaks injections fails the build.
      - run: python -m evals.run_eval --split test --gate
        env: { LLM_PROVIDER: heuristic }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: eval-report, path: agent/evals/results/latest.* }
